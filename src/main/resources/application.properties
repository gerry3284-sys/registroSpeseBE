spring.application.name=RegistroSpese

# Connessione al DB
spring.datasource.url=jdbc:mariadb://localhost:3306/registrospese
spring.datasource.username=root
# Cambio Password: ALTER USER 'root'@'localhost' IDENTIFIED BY 'NuovaPassword';
spring.datasource.password=mariaPassword
